# SPDX-License-Identifier: GPL-3.0-only
[workspace]
members = ["common", "jobmarshal", "wrapper"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Julio Merino <julio@meroh.net>"]
repository = "https://github.com/jmmv/jobmarshal"
publish = false

[workspace.lints.rust]
anonymous_parameters = "warn"
bad_style = "warn"
missing_docs = "warn"
unused = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
unsafe_code = "warn"

[workspace.lints.clippy]
await_holding_refcell_ref = "allow"
collapsible_else_if = "allow"

[workspace.dependencies]
assert_cmd = "2"
getoptsargs = "0.4"
jobserver = "0.1.35"
tempfile = "3"
anyhow = "1"
daemonize = "0.5"
fs2 = "0.4"
jobmarshal-common = { path = "common" }
nix = { version = "0.30", features = ["fs", "poll", "signal", "socket", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xdg = "3"
